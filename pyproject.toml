[project]
name = "repo_standards_validator"
dynamic = ["version"]
requires-python = "~=3.15.0"
dependencies = [
  "structlog==26.1.0",
  "pygithub==2.10.0",
  "GitPython==3.2.1",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.2",
  "vulture==2.16",
  "ty==0.0.91",
  "check-jsonschema==0.38.2",
]

[tool.uv]
required-version = "~=0.13.0"
package = false

[tool.setuptools]
py-modules = ["validator", "tests"]

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["ALL"]

ignore = [
  "CPY001",  # Copyright is maintained in LICENCE
  "COM812",  # Ignore due to conflict with Ruff formatter
  "ISC001",  # Ignore due to conflict with Ruff formatter
  "PLR2004", # Ignore magic value
  "D104",    # Ignore missing docstring in public package
  "D100",    # Ignore missing docstring in public module
  "SIM112",  # Ignore Lowercase environment variables (used for GitHub actions)
]

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**test_*.py" = ["S101", "D101", "D102", "D103", "SLF001", "FBT001", "PLR0913", "PLR0917"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["tests"]

[tool.vulture]
ignore_names = ["owner", "side_effect"]
