minimum_prek_version: "0.5.7"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen --extra dev ruff check
        language: python
        additional_dependencies: [uv==0.13.5]
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen --extra dev ruff format --check
        language: python
        additional_dependencies: [uv==0.13.5]
        types: [python]
      - id: ty-check
        name: Python type checks
        entry: uv run --frozen --extra dev ty check .
        language: python
        additional_dependencies: [uv==0.13.5]
        types: [python]
        pass_filenames: false
      - id: uv-lock
        name: UV lockfile check
        entry: uv lock --check
        language: python
        additional_dependencies: [uv==0.13.5]
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
